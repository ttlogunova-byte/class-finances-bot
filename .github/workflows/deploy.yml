name: Deploy bot

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-class-finances-bot
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: class-finances-bot
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create volume if missing
        run: |
          if flyctl volumes list -a "$FLY_APP" | grep -q bot_data; then
            echo "Volume bot_data already exists"
          else
            echo "Creating volume bot_data"
            flyctl volumes create bot_data --size 1 --region ams -a "$FLY_APP" --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only -a "$FLY_APP"

      - name: Keep exactly one machine
        run: flyctl scale count 1 -a "$FLY_APP" --yes

      - name: Result
        run: |
          flyctl volumes list -a "$FLY_APP"
          flyctl machines list -a "$FLY_APP"
