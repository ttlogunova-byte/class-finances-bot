name: Deploy bot

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-class-finances-bot
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: class-finances-bot
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create volume if missing
        run: |
          set -eux
          COUNT=$(flyctl volumes list -a "$FLY_APP" --json | jq '[.[] | select(.name=="bot_data")] | length')
          echo "volumes named bot_data: $COUNT"
          if [ "${COUNT:-0}" -lt 1 ]; then
            flyctl volumes create bot_data --size 1 --region ams -a "$FLY_APP" --yes
          fi
          flyctl volumes list -a "$FLY_APP"

      - name: Scale down to one machine
        run: |
          set -eux
          flyctl scale count 1 -a "$FLY_APP" --yes || true
          sleep 5
          flyctl machines list -a "$FLY_APP"

      - name: Deploy
        run: flyctl deploy --remote-only -a "$FLY_APP"

      - name: Result
        run: |
          flyctl volumes list -a "$FLY_APP"
          flyctl machines list -a "$FLY_APP"
